services:
  mongo:
    image: mongo:8
    container_name: go-tigrinho-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  app:
    image: golang:1.25
    container_name: go-tigrinho-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: tigrinho
      PORT: "8080"
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    command: sh -c "go mod download && go run ./cmd/server"

volumes:
  mongo_data:
